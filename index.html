    let currentTab = 'wilayah';
    let map;
    let markersGroup = L.layerGroup();

    // Inisialisasi Peta Leaflet
    function initMap() {
        map = L.map('map').setView([-5.14766, 119.43273], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        markersGroup.addTo(map);
    }

    // Inisialisasi Dropdown Wilayah
    function initDropdowns() {
        const kecSelect = document.getElementById('select-kecamatan');
        const kecSet = new Set(dataBankSampah.map(item => item.Kecamatan).filter(Boolean));

        Array.from(kecSet).sort().forEach(kec => {
            let opt = document.createElement('option');
            opt.value = kec;
            opt.textContent = kec;
            kecSelect.appendChild(opt);
        });

        updateKelurahanDropdown();
    }

    function updateKelurahanDropdown() {
        const kecVal = document.getElementById('select-kecamatan').value;
        const kelSelect = document.getElementById('select-kelurahan');
        kelSelect.innerHTML = '<option value="">Pilih Kelurahan</option>';

        let filtered = dataBankSampah;
        if (kecVal) {
            filtered = dataBankSampah.filter(item => item.Kecamatan === kecVal);
        }

        const kelSet = new Set(filtered.map(item => item.Kelurahan).filter(Boolean));
        Array.from(kelSet).sort().forEach(kel => {
            let opt = document.createElement('option');
            opt.value = kel;
            opt.textContent = kel;
            kelSelect.appendChild(opt);
        });
    }

    // Tab Switching
    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('btn-wilayah').classList.toggle('active', tab === 'wilayah');
        document.getElementById('btn-nama').classList.toggle('active', tab === 'nama');
        document.getElementById('tab-wilayah').classList.toggle('active', tab === 'wilayah');
        document.getElementById('tab-nama').classList.toggle('active', tab === 'nama');
        filterData();
    }

    // Custom Recycle Marker Icon
    const customIcon = L.divIcon({
        className: 'recycle-marker',
        html: `<svg viewBox="0 0 24 24"><path d="M7 19l-4-4 4-4v3h5v2H7v3zm10-14l4 4-4 4V10h-5V8h5V5zm-6 9.5l-1.4 1.4L4.8 11.1l4.8-4.8L11 7.7l-3.4 3.4 3.4 3.4z"/></svg>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11]
    });

    // Filter & Render
    function filterData() {
        let list = [...dataBankSampah];

        if (currentTab === 'wilayah') {
            const kecVal = document.getElementById('select-kecamatan').value;
            const kelVal = document.getElementById('select-kelurahan').value;
            if (kecVal) list = list.filter(item => item.Kecamatan === kecVal);
            if (kelVal) list = list.filter(item => item.Kelurahan === kelVal);
        } else {
            const searchVal = document.getElementById('input-search').value.toLowerCase();
            if (searchVal) list = list.filter(item => item.Nama_Bank_Sampah.toLowerCase().includes(searchVal));
        }

        renderUI(list);
    }

    function renderUI(data) {
        const container = document.getElementById('tps-container');
        const badge = document.getElementById('count-badge');
        container.innerHTML = '';
        markersGroup.clearLayers();
        let bounds = [];

        badge.textContent = `${data.length} Lokasi`;

        data.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'tps-row';
            row.innerHTML = `
                <div class="tps-idx">${index + 1}.</div>
                <div class="tps-info">
                    <div class="tps-name">${item.Nama_Bank_Sampah}</div>
                    <div class="tps-address">${item.Alamat}</div>
                    <div class="tps-loc">Kec. ${item.Kecamatan} - Kel. ${item.Kelurahan}</div>
                </div>
                <div>
                    <a href="https://wa.me/6281141100777" target="_blank" class="btn-wa">Hubungi via WA</a>
                </div>
            `;
            container.appendChild(row);

            if (item.Latitude && item.Longitude) {
                const marker = L.marker([item.Latitude, item.Longitude], { icon: customIcon });
                marker.bindPopup(`
                    <strong>${item.Nama_Bank_Sampah}</strong><br>
                    ${item.Alamat}<br>
                    <small>Kec. ${item.Kecamatan}, Kel. ${item.Kelurahan}</small>
                `);
                markersGroup.addLayer(marker);
                bounds.push([item.Latitude, item.Longitude]);
            }
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [20, 20] });
        }
    }

    document.getElementById('select-kecamatan').addEventListener('change', () => {
        updateKelurahanDropdown();
        filterData();
    });

    window.onload = () => {
        initMap();
        initDropdowns();
        filterData();
    };
</script>
</body>
</html>
